<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Be+Vietnam+Pro:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared-cover-system.css" />

<body class="split-cover-page" data-output-name="newhomes-oceanpark-cover-06">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="pin-icon" viewBox="0 0 24 24">
      <path d="M12 22s7-7.5 7-13a7 7 0 10-14 0c0 5.5 7 13 7 13z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="12" cy="9" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
    </symbol>
    <symbol id="factory-icon" viewBox="0 0 24 24">
      <path d="M3 20V11l5 3V11l5 3V11l5 3V8l3-2v14H3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>
<main id="cover-root" style="--cover-bg-image: url('assets/backgrounds/cover-06.jpg')"></main>
<div class="split-toolbar" aria-label="Export controls">
  <button type="button" onclick="downloadCoverPng(1)">Download PNG</button>
  <button type="button" onclick="downloadCoverPng(3)">Download PNG @3x</button>
</div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1" crossorigin="anonymous"></script>
<script type="text/babel" src="shared-cover-components.jsx"></script>
<script type="text/babel">
  renderCover(CoverV6);
  requestAnimationFrame(() => {
    document.querySelector('.cover-original')?.classList.add('has-bg');
    document.querySelector('.cover-original')?.style.setProperty('--cover-bg-image', "url('assets/backgrounds/cover-06.jpg')");
  });
</script>
<script src="export-png.js"></script>
<script src="cover-background-upload-toolbar-with-localstorage-persistence.js"></script>
</body>
